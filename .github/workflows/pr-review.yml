name: PR Review & Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-progress run for the same PR to avoid redundant work
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Automated Quality Checks (Lint, Type-Check, Build)
  quality-checks:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations for CI
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./prisma/ci-test.db"

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Next.js build check
        run: npm run build
        env:
          DATABASE_URL: "file:./prisma/ci-test.db"

  # Job 2: AI Architecture and Design Plan Review Agent
  # Requires OPENAI_API_KEY to be set in repository secrets.
  ai-review:
    name: "AI Architecture Review"
    runs-on: ubuntu-latest
    needs: quality-checks
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD -- \
            '*.ts' '*.tsx' '*.css' '*.json' '*.prisma' \
            ':!package-lock.json' ':!*.tsbuildinfo' \
            | head -c 28000 > /tmp/pr_diff.txt
          echo "Diff size: $(wc -c < /tmp/pr_diff.txt) bytes"

      - name: Run AI Review Agent
        id: ai_review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # Pass all multi-line content via process.env, not via ${{ }} interpolation.
          # This avoids syntax errors from backticks and special characters in diffs.
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('/tmp/pr_diff.txt', 'utf8');
            const implPlan = fs.existsSync('.github/docs/implementation_plan.md')
              ? fs.readFileSync('.github/docs/implementation_plan.md', 'utf8')
              : 'Not found';
            const devGuide = fs.existsSync('.github/docs/development_guidelines.md')
              ? fs.readFileSync('.github/docs/development_guidelines.md', 'utf8')
              : 'Not found';

            const systemPrompt = [
              'You are a senior code reviewer for a Next.js Indian bakery e-commerce website.',
              'Review this PR for compliance with the project architecture and design guidelines.',
              '',
              'Check each of the following:',
              '1. ARCHITECTURE: Files are in the correct folders per the implementation plan.',
              '   - Components: src/components/{ui,layout,catalog,checkout}/Name/Name.tsx + Name.module.css + index.ts',
              '   - Context: src/context/, Hooks: src/hooks/, Utils: src/utils/, Types: src/types/',
              '   - API routes: src/app/api/ (server-only)',
              '2. NAMING: PascalCase for components/folders, camelCase for hooks/utils, UPPER_SNAKE_CASE for constants.',
              '3. STYLING: No Tailwind CSS. CSS Modules only. No hardcoded hex colors (use CSS variables from globals.css).',
              '4. CLIENT VS SERVER: use client directive only when the component uses hooks, events, or browser APIs.',
              '5. SECURITY: No API secrets in client-side code. No NEXT_PUBLIC_ prefix on sensitive values.',
              '6. BREAKAGE RISK: Missing imports, wrong export patterns, TypeScript type errors.',
              '7. PLAN ALIGNMENT: Does this PR implement what the implementation plan says it should?',
              '',
              'Respond in this format:',
              'Verdict: APPROVED / NEEDS CHANGES / REJECTED',
              '',
              'Then one short paragraph per check category above. Be specific and reference file names.',
              'Keep the total response under 400 words.'
            ].join('\n');

            const userPrompt = [
              '## PR Diff',
              '```diff',
              diff.slice(0, 20000),
              '```',
              '',
              '## Implementation Plan',
              implPlan.slice(0, 4000),
              '',
              '## Development Guidelines',
              devGuide.slice(0, 4000)
            ].join('\n');

            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) {
              core.setOutput('review', 'OPENAI_API_KEY secret is not set. Skipping AI review.');
              return;
            }

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                max_tokens: 800,
                temperature: 0.2
              })
            });

            const data = await response.json();

            if (data.error) {
              core.setOutput('review', 'AI review failed: ' + data.error.message);
              return;
            }

            const review = data.choices?.[0]?.message?.content || 'No review generated.';
            core.setOutput('review', review);

      - name: Post AI review comment on PR
        uses: actions/github-script@v7
        env:
          AI_REVIEW: ${{ steps.ai_review.outputs.review }}
        with:
          script: |
            const review = process.env.AI_REVIEW || 'No review available.';
            const body = [
              '## AI Architecture Review',
              '',
              review,
              '',
              '---',
              '_Automated review checking compliance with `.github/docs/implementation_plan.md` and `.github/docs/development_guidelines.md`._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
